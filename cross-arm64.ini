[binaries]
c = ['clang', '--target=aarch64-linux-gnu']
cpp = ['clang++', '--target=aarch64-linux-gnu']
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
ld = 'aarch64-linux-gnu-ld'
# clang uses its integrated assembler (IAS); the iSH arm64 gadgets are IAS syntax
# (e.g. `ldr x8,[_pc],#8`, symbol-as-immediate `_tlb`) which GNU `as` rejects.
# pkg-config: none (sqlite3 via LDFLAGS/CPPFLAGS; libarchive only needed for fakefsify)
pkg-config = 'false'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
